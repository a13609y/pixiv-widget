name: Pixiv 每日美图
description: 免登录搜索 Pixiv 全站插画，按小组件尺寸自动匹配画幅；可选抓取登录 Cookie 以跟随热门搜索
author: Cuttlefish
icon: photo.on.rectangle.angled
homepage: https://github.com/a13609y/pixiv-widget
manual: https://github.com/a13609y/pixiv-widget#readme

# ── 模块设置页的控件（下方环境变量区块自动生成 UI）─────────────
env_schema:
  # ── 搜索 ──────────────────────────────────────────────
  SOURCE:
    name: 搜索源
    description: "第三方代理=服务端筛画幅/时段，速度快（挂了自动退回官方）；官方网页=直连 pixiv"
    options: ["第三方代理", "官方网页"]
  KEYWORD:
    name: 搜索词 【通用】
    description: 标签模糊搜索，留空则跟随热门搜索
    default_value: ""
  TAGS:
    name: 精确标签 【通用】
    description: 多个用 | 或 , 分隔，取第一个作为搜索词
    default_value: ""
  ORDER:
    name: 排序 【通用】
    description: "最新发布=按时间倒序；人气最高=按热度（网页端未登录时会退化成最新）"
    options: ["最新发布", "人气最高"]
  PERIOD:
    name: 时段 【通用】
    description: "只取最近这段时间发布的作品：代理用 duration 参数，官方网页用 scd 参数，两边都实测有效"
    options: ["不限", "一天内", "一周内", "一个月内", "半年内", "一年内"]
  RATIO:
    name: 画幅·全局 【仅代理】
    description: "各尺寸填「跟随全局」时用这里的画幅。自动=服务端不筛，按尺寸本地挑（中号优先横图、小号优先方图）；官方网页模式下整项忽略"
    options: ["自动", "横图", "方图", "竖图"]
  RATIO_SMALL:
    name: 画幅·小号 【仅代理】
    description: "服务器直接返回指定画幅，命中率 100%。跟随全局=用上面的画幅"
    options: ["跟随全局", "横图", "方图", "竖图"]
  RATIO_MEDIUM:
    name: 画幅·中号 【仅代理】
    description: "推荐填「横图」，中号 2.1:1 不会再出现方图兜底"
    options: ["跟随全局", "横图", "方图", "竖图"]
  RATIO_LARGE:
    name: 画幅·大号 【仅代理】
    description: "大号 1:1 左右，推荐填「方图」或跟随全局"
    options: ["跟随全局", "横图", "方图", "竖图"]
  RATIO_XLARGE:
    name: 画幅·超大号 【仅代理】
    description: "iPad 超大号（约 2:1）。锁屏 accessory 不使用此项"
    options: ["跟随全局", "横图", "方图", "竖图"]
  TYPE:
    name: 作品类型 【仅网页】
    description: "第三方代理固定只返回插画，此项仅在官方网页模式生效"
    options: ["只要插画", "只要漫画", "插画+漫画"]
  R18:
    name: R18 过滤 【通用】
    description: "排除R18=只要全年龄（默认）；只要R18=只取 R18，建议配第三方代理；全部=不过滤。第三方接口无视 r18 参数，一律本地按 x_restrict 筛"
    options: ["排除R18", "只要R18", "全部"]
  AI_MODE:
    name: AI 作品 【通用】
    description: "按 illust_ai_type 本地过滤，两个源都生效（比接口自带开关可靠）"
    options: ["不筛选", "只要AI生成", "排除AI生成"]
  EXCLUDE_TAGS:
    name: 排除标签 【通用】
    description: 命中任意一个标签就跳过，用 | 分隔
    default_value: ""
  MAX_PAGE:
    name: 翻页上限 【通用】
    description: "1=只看最新；3=推荐；越大越可能遇到旧作品"
    options: ["1", "2", "3", "5", "10"]
  API_BASE:
    name: 接口地址 【仅代理】
    description: 默认 api.cocomi.eu.org（hibiapi 系），可换自建
    default_value: "https://api.cocomi.eu.org"

  # ── 登录态 ────────────────────────────────────────────
  TRENDING:
    name: 热门搜索 【通用·需登录】
    description: "自动=抓到登录 Cookie 才跟随热搜词；关闭=只用上面的搜索词"
    options: ["自动", "总是使用", "关闭"]
  COOKIE_SOURCE:
    name: Cookie 来源 【通用】
    description: "手动优先=填了就只用手填的（旧 Cookie 会挡住自动更新）；自动优先=自动抓到就用自动的，抓不到才用手填；只用自动=完全忽略手填"
    options: ["手动优先", "自动优先", "只用自动"]
  PIXIV_COOKIE:
    name: 手动 Cookie 【通用】
    description: 自动抓不到时手动粘贴整串 Cookie（会自动提取 PHPSESSID）
    default_value: ""
  AUTO_CAPTURE:
    name: 自动抓取 Cookie 【通用】
    description: 浏览 pixiv.net 时自动抓取登录 Cookie；关闭后完全不抓、不提示
    options: ["开启", "关闭"]
  NOTIFY:
    name: 登录失效通知 【通用】
    description: 每小时检测一次，失效时通知；点击通知直接打开 pixiv.net
    options: ["开启", "关闭"]

  # ── 展示 ──────────────────────────────────────────────
  NO_REPEAT:
    name: 防重复窗口 【通用】
    description: "最近 N 张不重复；超过 N 张才可能再次出现。池里的图全在这 N 张内时会随机重复一张，并在 6 小时内不再为此反复搜索"
    options: ["10", "30", "50", "100", "200"]
  COOLDOWN:
    name: 换图间隔 【通用】
    description: 分钟，0 表示每次刷新都换
    default_value: "30"
  IMAGE_QUALITY:
    name: 图片质量 【通用】
    description: "自动=小号用 540 方图、中大号用 1200 高清"
    options: ["自动", "高清1200", "省流540"]
  IMG_HOST:
    name: 图床 【通用】
    description: 取不到图时可换另一个
    options: ["i.pixiv.re", "i.pixiv.cat"]
  ASPECT_FIT:
    name: 画幅匹配 【仅网页】
    description: "官方网页模式本地挑画幅用；代理模式选过画幅后自动关闭（避免白翻页）"
    options: ["自动匹配", "纯随机"]
  SHOW_INFO:
    name: 显示标题作者 【通用】
    options: ["true", "false"]
  DEBUG:
    name: 调试角标 【通用】
    description: "显示一行状态：🔑/🔒 · 画幅/目标 · in横图 near方图 skip已服务端筛 · 词来源 · 拦截HH:MM"
    options: ["true", "false"]

scriptings:
  # 1) 自动抓取 PHPSESSID：浏览 pixiv.net 时后台静默收集
  - http_request:
      name: Pixiv Cookie 自动抓取
      match: "^https?://([a-z0-9-]+[.])*pixiv[.]net(:[0-9]+)?/"
      script_url: https://raw.githubusercontent.com/a13609y/pixiv-widget/main/pixiv-cookie.js
      body_required: false
      timeout: 10

  # 2) 每小时检测登录态，失效就通知（点击直达 pixiv.net）
  - schedule:
      name: Pixiv Cookie 定时检测
      cron: "0 * * * *"
      script_url: https://raw.githubusercontent.com/a13609y/pixiv-widget/main/pixiv-cookie-check.js
      timeout: 30

  # 3) 小组件本体
  - generic:
      name: PixivWidget
      script_url: https://raw.githubusercontent.com/a13609y/pixiv-widget/main/setu.js
      timeout: 60

widgets:
  - name: 每日美图
    script_name: PixivWidget
    env:
      TYPE: "illust"
      MAX_PAGE: "3"
      TRENDING: "auto"
      COOLDOWN: "30"

# 抓包只用来读 Cookie，不改写任何流量
mitm:
  hostnames:
    - "www.pixiv.net"
    - "accounts.pixiv.net"
