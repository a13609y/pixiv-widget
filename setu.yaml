name: Pixiv 每日美图
description: 免登录搜索 Pixiv 全站插画，按小组件尺寸自动匹配画幅；可选抓取登录 Cookie 以跟随热门搜索
author: Cuttlefish
icon: photo.on.rectangle.angled
homepage: https://github.com/a13609y/pixiv-widget
manual: https://github.com/a13609y/pixiv-widget#readme

# ── 模块设置页的控件（下方环境变量区块自动生成 UI）─────────────
env_schema:
  KEYWORD:
    name: 搜索词
    description: 标签模糊搜索，留空则跟随热门搜索
    default_value: ""
  TAGS:
    name: 精确标签
    description: 多个用 | 或 , 分隔，取第一个作为搜索词
    default_value: ""
  SOURCE:
    name: 搜索源
    description: "第三方代理=支持服务端横竖方筛选、速度更快（不稳定时自动退回官方）；官方网页=直连 pixiv 搜索，仅本地按画幅挑"
    options: ["第三方代理", "官方网页"]
  RATIO:
    name: 画幅筛选
    description: "仅第三方代理有效：由服务器直接返回指定画幅，横图命中率 100%；官方网页模式下此选项忽略"
    options: ["自动", "横图", "方图", "竖图"]
  API_BASE:
    name: 第三方接口地址
    description: "默认 api.cocomi.eu.org（该接口需普通浏览器 UA）；可换自建 hibiapi"
    default_value: "https://api.cocomi.eu.org"
  ORDER:
    name: 排序方式
    description: "最新发布=按时间倒序，永远拿到刚发的；人气最高=按投稿热度，未登录时会自动退化成最新"
    options: ["最新发布", "人气最高"]
  TYPE:
    name: 作品类型
    description: "只要插画=排除漫画和动图（推荐）；插画+漫画=混合"
    options: ["只要插画", "只要漫画", "插画+漫画"]
  AI_MODE:
    name: AI 作品
    description: "按 Pixiv 的 aiType 判定（投稿者自己标注的），选「只要AI生成」时建议配 AI 向标签"
    options: ["不筛选", "只要AI生成", "排除AI生成"]
  EXCLUDE_TAGS:
    name: 排除标签
    description: 命中任意一个就跳过，用 | 分隔
    default_value: ""
  MAX_PAGE:
    name: 最多翻到第几页
    description: "1=只看最新；3=推荐；越大越可能遇到旧作品，但画幅匹配机会更多"
    options: ["1", "2", "3", "5", "10"]
  TRENDING:
    name: 热门搜索
    description: "自动=抓到登录 Cookie 才跟随热搜词，没有就用默认词；总是使用=强制；关闭=只用上面的搜索词"
    options: ["自动", "总是使用", "关闭"]
  COOLDOWN:
    name: 换图间隔
    description: 分钟，0 表示每次刷新都换
    default_value: "30"
  IMAGE_QUALITY:
    name: 图片质量
    description: "自动=小号用 540 方图省流量、中大号用 1200 高清；强制高清更清楚但费流量"
    options: ["自动", "高清1200", "省流540"]
  IMG_HOST:
    name: 图床
    description: 取不到时可换另一个
    options: ["i.pixiv.re", "i.pixiv.cat"]
  ASPECT_FIT:
    name: 画幅匹配
    description: "自动匹配=按小组件尺寸优先挑横图/方图（推荐）；纯随机=完全不挑"
    options: ["自动匹配", "纯随机"]
  SHOW_INFO:
    name: 显示标题作者
    options: ["true", "false"]
  PIXIV_COOKIE:
    name: 手动 Cookie（可选）
    description: 自动抓不到时，从浏览器/抓包里复制 PHPSESSID 粘这里（可整串 Cookie，会自动提取）
    default_value: ""
  AUTO_CAPTURE:
    name: 自动抓取 Cookie
    description: "开启后浏览 pixiv.net 时自动抓取登录 Cookie；关闭则完全不动存储、不抓也不提示，只透传请求"
    options: ["开启", "关闭"]
  NOTIFY:
    name: 登录失效通知
    description: "每小时检测一次登录态，失效时发通知；点击通知直接打开 pixiv.net 重新登录（关闭后仍然检测，只是不提醒）"
    options: ["开启", "关闭"]
  DEBUG:
    name: 调试角标
    description: "开启后图左下角显示一行状态：🔑=登录Cookie已生效 / 🔒=未生效；a/b=作品画幅/目标画幅；in=横图(第一档)、near=方图(第二档)、relaxed=兜底；词来源 trending=热搜词、config=你填的、default=兜底词、池=直接用候选池；拦截HH:MM=抓包脚本最后一次被调用的时间"
    options: ["true", "false"]

scriptings:
  # 1) 自动抓取 PHPSESSID：浏览 pixiv.net 时后台静默收集
  - http_request:
      name: Pixiv Cookie 自动抓取
      match: "^https?://([a-z0-9-]+[.])*pixiv[.]net(:[0-9]+)?/"
      script_url: https://raw.githubusercontent.com/a13609y/pixiv-widget/main/pixiv-cookie.js
      body_required: false
      timeout: 10

  # 2) 每小时检测登录态，失效就通知（点击直达 pixiv.net）
  - schedule:
      name: Pixiv Cookie 定时检测
      cron: "0 * * * *"
      script_url: https://raw.githubusercontent.com/a13609y/pixiv-widget/main/pixiv-cookie-check.js
      timeout: 30

  # 3) 小组件本体
  - generic:
      name: PixivWidget
      script_url: https://raw.githubusercontent.com/a13609y/pixiv-widget/main/setu.js
      timeout: 60

widgets:
  - name: 每日美图
    script_name: PixivWidget
    env:
      TYPE: "illust"
      MAX_PAGE: "3"
      TRENDING: "auto"
      COOLDOWN: "30"

# 抓包只用来读 Cookie，不改写任何流量
mitm:
  hostnames:
    - "www.pixiv.net"
    - "accounts.pixiv.net"
