name: Pixiv 每日美图
description: 免登录搜索 Pixiv 全站插画，按小组件尺寸自动匹配画幅；可选抓取登录 Cookie 以跟随热门搜索
author: Cuttlefish
icon: photo.on.rectangle.angled

# ── 模块设置页的控件（下方环境变量区块自动生成 UI）─────────────
env_schema:
  KEYWORD:
    name: 搜索词
    description: 标签模糊搜索，留空则跟随热门搜索
    default_value: ""
  TAGS:
    name: 精确标签
    description: 多个用 | 或 , 分隔，取第一个作为搜索词
    default_value: ""
  ORDER:
    name: 排序
    description: 热门排序在未登录时会退化成最新
    options: ["date_d", "popular_d"]
  TYPE:
    name: 作品类型
    description: illust 只要插画，manga 只要漫画
    options: ["illust", "manga", "all"]
  AI_MODE:
    name: AI 作品
    description: only 只要 AI 生成，exclude 过滤掉 AI
    options: ["any", "only", "exclude"]
  EXCLUDE_TAGS:
    name: 排除标签
    description: 命中任意一个就跳过，用 | 分隔
    default_value: ""
  MAX_PAGE:
    name: 最多翻到第几页
    description: 越大作品越旧，1 表示只看最新
    options: ["1", "2", "3", "5", "10"]
  TRENDING:
    name: 热门搜索
    description: auto 抓到登录态后自动跟随热搜词
    options: ["auto", "on", "off"]
  COOLDOWN:
    name: 换图间隔
    description: 分钟，0 表示每次刷新都换
    default_value: "30"
  IMAGE_QUALITY:
    name: 图片质量
    description: auto 小号用 540 方图、中大号用 1200
    options: ["auto", "master", "thumb"]
  IMG_HOST:
    name: 图床
    description: 取不到时可换另一个
    options: ["i.pixiv.re", "i.pixiv.cat"]
  ASPECT_FIT:
    name: 画幅匹配
    description: auto 按尺寸挑横图/方图，off 纯随机
    options: ["auto", "off"]
  SHOW_INFO:
    name: 显示标题作者
    options: ["true", "false"]
  PIXIV_COOKIE:
    name: 手动 Cookie（可选）
    description: 自动抓不到时，从浏览器/抓包里复制 PHPSESSID 粘这里（可整串 Cookie，会自动提取）
    default_value: ""
  DEBUG:
    name: 调试角标
    description: 图上显示 🔑/🔒 与画幅、词来源
    options: ["true", "false"]

scriptings:
  # 1) 自动抓取 PHPSESSID：浏览 pixiv.net 时后台静默收集
  - http_request:
      name: Pixiv Cookie 自动抓取
      match: "^https://www\\.pixiv\\.net/"
      script_url: https://raw.githubusercontent.com/a13609y/pixiv-widget/main/pixiv-cookie.js
      body_required: false
      timeout: 10

  # 2) 小组件本体
  - generic:
      name: PixivWidget
      script_url: https://raw.githubusercontent.com/a13609y/pixiv-widget/main/setu.js
      timeout: 60

widgets:
  - name: 每日美图
    script_name: PixivWidget
    env:
      TYPE: "illust"
      MAX_PAGE: "3"
      TRENDING: "auto"
      COOLDOWN: "30"

# 抓包只用来读 Cookie，不改写任何流量
mitm:
  hostnames:
    - "www.pixiv.net"
    - "accounts.pixiv.net"
